baseURL = "https://hugo-paper.vercel.app/"
title = "My Portfolio"
author = "손민균"
copyright = "© 2026, Son Mingyun"
locale = "ko"
DefaultContentLanguage = "ko"
enableInlineShortcodes = true
# prevent build failures when using Hugo's Instagram shortcode due to deprecated Instagram API.
# See https://github.com/gohugoio/hugo/issues/7228#issuecomment-714490456
ignoreErrors = ["error-remote-getjson"]
[pagination]
  pagerSize = 3

# ------------------------------


[params]
  color = 'linen'
  github = 'microbot125'
  instagram = 'microbot125'

avatar = 'smglink25@gmail.com'
  name = '손민균'
  bio = '이것저것 건드려보는 컴퓨터인공지능학부 학생'
# ------------------------------

# needed to  render raw HTML (e.g. <sub>, <sup>, <kbd>, <mark>)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
#  [markup.highlight]
#    lineNos = true

[menu]

  [[menu.main]]
    identifier = "about"
    name = "소개"
    url = "/about/"
    weight = 10
  [[menu.main]]
    identifier = "contact"
    name = "연락"
    url = "/contact/"
    weight = 10

[taxonomies]
category = "categories"
tag = "tags"
series = "series"

[privacy]

  [privacy.vimeo]
    disabled = false
    simple = true

  [privacy.x]
    disabled = false
    enableDNT = true
    simple = true

  [privacy.instagram]
    disabled = false
    simple = true

  [privacy.youtube]
    disabled = false
    privacyEnhanced = true

[services]

  [services.instagram]
    disableInlineCSS = true

  [services.x]
    disableInlineCSS = true
